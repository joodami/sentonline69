<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbwLuCaClwlyTiMxxYl6fXMwK9WjE7pdvC3Sf1HdlDCRlHLy4OrwYSkxE8zfaMSjCdjOoQ/exec';

    document.getElementById('signForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const loading = document.getElementById('loading');
        const file = document.getElementById('fileInput').files[0];

        // จำกัด 50 MB
        if (file.size > 50 * 1024 * 1024) {
            Swal.fire('ไฟล์ใหญ่เกินไป', 'ระบบรองรับไฟล์ PDF ไม่เกิน 50MB ค่ะ', 'error');
            return;
        }

        loading.style.display = 'flex';

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function() {
            const base64Data = reader.result.split(',')[1];
            
            // เตรียมข้อมูลให้ตรงกับ Column ในชีท
            const payload = {
                date: new Date().toLocaleDateString('th-TH'), // วันที่ส่ง
                name: document.getElementById('name').value,
                title: document.getElementById('title').value,
                remarks: "ส่งผ่านระบบ Web App", 
                fileData: base64Data,
                fileName: file.name,
                fileType: file.type
            };

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                loading.style.display = 'none';
                if (result.status === 'success') {
                    Swal.fire('สำเร็จ!', 'ส่งเอกสารและแจ้งเตือน LINE เรียบร้อยค่ะ', 'success')
                        .then(() => location.reload());
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                loading.style.display = 'none';
                Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อหลังบ้านได้', 'error');
            }
        };
    });
</script>
